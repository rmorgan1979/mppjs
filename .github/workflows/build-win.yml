# Valaris fork: build ONLY the Windows x64 binary with the completed reflection
# config, prove it converts MPXJ's samples (and our fixture, if committed), and
# publish the exe to the `binaries` branch of this fork — plain git over https,
# because our network reaches github.com but not Actions artifact storage or
# release-asset downloads.
name: build-win

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".ni-config/**", "java/**", "test/fixtures/**", ".github/workflows/build-win.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Set up Liberica NIK (JDK 21 + native-image)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "liberica"
          native-image-job-reports: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Build fat jar
        working-directory: java
        run: mvn -B -q -DskipTests package

      - name: Build native binary
        run: >-
          native-image
          -H:+UnlockExperimentalVMOptions
          --no-fallback
          -H:+AddAllCharsets
          -H:ConfigurationFileDirectories=.ni-config
          -H:Name=mpxj-convert
          -H:Path=bin
          -jar java/target/mpxj-convert.jar

      - name: Smoke-convert MPXJ samples and our fixtures
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/joniles/mpxj /tmp/mpxj
          mkdir -p /tmp/out
          ok=0; fail=0; gap=0
          for f in /tmp/mpxj/junit/data/*.mpp test/fixtures/*.mpp; do
            [ -f "$f" ] || continue
            if ./bin/mpxj-convert.exe "$f" "/tmp/out/$(basename "$f").xml" 2>/tmp/err.txt; then
              ok=$((ok+1))
            else
              fail=$((fail+1)); echo "FAILED: $f"; grep -v "Log4j" /tmp/err.txt | head -3
              # An adapter-constructor failure means the reflection config is still short.
              if grep -q "No default constructor found" /tmp/err.txt; then gap=$((gap+1)); fi
              # Fixtures must convert; MPXJ samples may legitimately be unreadable (corrupt-file tests).
              case "$f" in test/fixtures/*) exit 1;; esac
            fi
          done
          echo "converted ok=$ok failed=$fail reflection-gaps=$gap"
          echo "Smoke: MPXJ junit samples converted ok=$ok failed=$fail (non-adapter failures such as password-protected files) reflection-gaps=$gap" > /tmp/smoke-summary.txt
          [ "$gap" -eq 0 ]

      - name: Upload artifact (7 days)
        uses: actions/upload-artifact@v7
        with:
          name: mpxj-convert-win32-x64
          path: bin/mpxj-convert.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish exe to the binaries branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::7}"
          ver="$(node -p "require('./package.json').version")"
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/pub
          # Append to the existing binaries branch (keeps every published commit
          # reachable for lockfile pins); start it if this is the first build.
          if git ls-remote --exit-code --heads "${repo}" binaries >/dev/null 2>&1; then
            git clone -q --branch binaries --single-branch --depth 1 "${repo}" /tmp/pub
          else
            mkdir -p /tmp/pub && (cd /tmp/pub && git init -q -b binaries)
          fi
          mkdir -p /tmp/pub/bin
          cp bin/mpxj-convert.exe /tmp/pub/bin/mpxj-convert.exe
          cp packages/_assets/LICENSE /tmp/pub/LICENSE
          cp packages/_assets/NOTICE /tmp/pub/NOTICE
          cat > /tmp/pub/package.json <<JSON
          {
            "name": "mppjs-win32-x64-valaris",
            "version": "${ver}",
            "description": "mppjs Windows x64 native binary rebuilt with the complete MSPDI reflection config (built from ${GITHUB_REPOSITORY}@${sha})",
            "license": "LGPL-2.1-or-later",
            "os": ["win32"],
            "cpu": ["x64"],
            "files": ["bin", "LICENSE", "NOTICE", "BUILD.txt"]
          }
          JSON
          echo "* binary" > /tmp/pub/.gitattributes
          {
            echo "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA} on $(date -u +%FT%TZ)"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            cat /tmp/smoke-summary.txt
            echo "SHA256: $(sha256sum bin/mpxj-convert.exe | cut -d' ' -f1)"
          } > /tmp/pub/BUILD.txt
          cd /tmp/pub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "mpxj-convert.exe from ${sha}"
          git push -q "${repo}" binaries:binaries
          echo "pushed binaries branch"
